version: '3.8'

services:
  postgresdb:
    image: postgres:15
    container_name: hrms_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: hrms_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: hrms_app
    ports:
      - "8080:8080"
    depends_on:
      - postgresdb
    environment:
      - DB_URL=jdbc:postgresql://postgresdb:5432/hrms_db
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgrespassword
      - SERVER_PORT=8080

volumes:
  postgres_data:
